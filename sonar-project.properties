# Reference settings for manual scans. Jenkins passes the same values to the Maven scanner.
sonar.host.url=https://sonarcloud.io
sonar.organization=devopsvibez
sonar.projectKey=devopsvibez_advanced-cicd-pipeline-aws
sonar.projectName=Chapter and Co Pipeline Lab
sonar.sources=app
sonar.tests=app
sonar.inclusions=app/App.java
sonar.exclusions=app/AppTest.java
sonar.test.inclusions=app/AppTest.java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.sourceEncoding=UTF-8
